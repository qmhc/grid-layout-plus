name: Collect Changesets or Release

on:
  push:
    branches:
      - main

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  run:
    if: github.repository == 'qmhc/grid-layout-plus'
    permissions:
      contents: write
      pull-requests: write
    runs-on: ubuntu-latest
    env:
      HUSKY: 0
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Set node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.x
          registry-url: https://registry.npmjs.org/
          cache: pnpm

      - name: Install deps
        run: pnpm install --frozen-lockfile

      - name: Build package
        run: pnpm run build

      - name: Create version PR or publish package
        id: changesets
        uses: changesets/action@a45c4d594aa4e2c509dc14a9f2b3b67ba3780d0d # v1.9.0
        with:
          publish: pnpm exec changeset publish
          version: pnpm run version-packages
          commit: 'release: version packages'
          title: 'release: version packages'
          createGithubReleases: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_OPTIONS: --max-old-space-size=4096

      - name: Select docs deployment branch
        id: docs-deployment
        if: steps.changesets.outputs.published == 'true'
        shell: bash
        run: |
          version="$(node -p "JSON.parse(require('node:fs').readFileSync('package.json', 'utf8')).version")"

          if [[ "$version" == *-* ]]; then
            branch='docs-next'
          else
            branch='docs-release'
          fi

          echo "branch=$branch" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Advance docs deployment branch
        if: steps.docs-deployment.outputs.branch != ''
        env:
          DOCS_BRANCH: ${{ steps.docs-deployment.outputs.branch }}
          RELEASE_VERSION: ${{ steps.docs-deployment.outputs.version }}
        run: |
          echo "Deploying documentation for v${RELEASE_VERSION} from ${GITHUB_SHA} to ${DOCS_BRANCH}"
          git push origin "HEAD:refs/heads/${DOCS_BRANCH}"
